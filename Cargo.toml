[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bunsin-core = { path = "crates/core" }
bunsin-store = { path = "crates/store" }
bunsin-llm = { path = "crates/llm" }
bunsin-connectors = { path = "crates/connectors" }
bunsin-coding = { path = "crates/coding" }
bunsin-engine = { path = "crates/engine" }
bunsin-api = { path = "crates/api" }
bunsin-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
