[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
bunsin-core = { path = "crates/core" }
bunsin-store = { path = "crates/store" }
bunsin-llm = { path = "crates/llm" }
bunsin-connectors = { path = "crates/connectors" }
bunsin-ard = { path = "crates/ard" }
bunsin-coding = { path = "crates/coding" }
bunsin-engine = { path = "crates/engine" }
bunsin-api = { path = "crates/api" }
bunsin-client = { path = "crates/client" }
bunsin-daemon = { path = "crates/daemon" }
bunsin-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs", "signal", "net"] }
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
# Tests only: checks the ARD catalog against the schema of an ARD entry. Released 2026-10-26.
# No default features: the tests resolve no schema over the network or from files.
jsonschema = { version = "=0.60.2", default-features = false }
