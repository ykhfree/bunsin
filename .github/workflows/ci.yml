name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The server and everything it needs. Linux is the server's target.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version and components.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude bunsin-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude bunsin-app --locked
      - name: The server must not depend on GPUI
        run: |
          if cargo tree -p bunsin-daemon --locked | grep -i gpui; then
            echo "bunsin-daemon depends on GPUI" >&2
            exit 1
          fi

  # The desktop app, and the whole workspace on macOS.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Linux server package. It is uploaded as an artifact of the run; nothing is published.
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # The ubuntu runner image has shellcheck.
      - run: shellcheck packaging/linux/build-tarball.sh packaging/macos/build-app.sh scripts/*.sh
      - name: Build the tarball
        run: packaging/linux/build-tarball.sh
      - name: Check the systemd unit
        # Informational: no test here has started the unit under systemd. The copy points at the built binary.
        continue-on-error: true
        run: |
          sed "s#/usr/local/bin/bunsind#$PWD/target/release/bunsind#" packaging/linux/bunsind.service \
            > "$RUNNER_TEMP/bunsind.service"
          systemd-analyze verify "$RUNNER_TEMP/bunsind.service"
      - uses: actions/upload-artifact@v4
        with:
          name: bunsin-server-linux
          path: target/package/bunsin-server-*.tar.gz*
          if-no-files-found: error
