name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The server and everything it needs. Linux is the server's target.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the Rust version and components.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude bunsin-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude bunsin-app --locked
      - name: The server must not depend on GPUI
        run: |
          if cargo tree -p bunsin-daemon --locked | grep -i gpui; then
            echo "bunsin-daemon depends on GPUI" >&2
            exit 1
          fi

  # The desktop app, and the whole workspace on macOS.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
