[package]
name = "bunsin-connectors"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bunsin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rmcp = { version = "=3.10.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# The same reqwest that rmcp uses. It is named here to build the client without redirects.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Versions already in Cargo.lock. They encode basic auth and check webhook signatures.
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2.workspace = true

[dev-dependencies]
rmcp = { version = "=3.10.0", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["net"] }
