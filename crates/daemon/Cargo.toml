[package]
name = "bunsin-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bunsind"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
bunsin-api.workspace = true
bunsin-ard.workspace = true
bunsin-client.workspace = true
bunsin-coding.workspace = true
bunsin-connectors.workspace = true
bunsin-core.workspace = true
bunsin-engine.workspace = true
bunsin-llm.workspace = true
bunsin-store.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
getrandom = "0.3"
url = "2"
# The inbound endpoint: a stateless MCP server on the outer listeners. The same rmcp as the connectors.
rmcp = { version = "=3.10.0", default-features = false, features = ["auth", "server", "transport-streamable-http-server"] }
# The A2A v1.0 wire types of the inbound A2A endpoint (a2aproject/a2a-rs). It is 0.x, so the version is exact.
a2a-lf = "=0.4.2"
# The time type of the A2A task status. The same chrono as a2a-lf.
chrono = { version = "0.4", default-features = false }
# The versions that rmcp uses. The OAuth client of connectors is built with them.
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# The Keychain holds the server's master key on macOS only. Linux servers need no keyring library.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[dev-dependencies]
# Already in Cargo.lock. A test writes the basic auth header that it expects.
base64 = "0.22"
# Already in Cargo.lock. The webhook tests sign their deliveries like Slack and Jira.
hex = "0.4"
hmac = "0.12"
sha2.workspace = true
bunsin-testkit.workspace = true
jsonschema.workspace = true
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tempfile.workspace = true
